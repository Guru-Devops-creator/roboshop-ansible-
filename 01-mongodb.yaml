- name: configure mongodb server  
  hosts: mongodb
  become: yes
  tasks: 
  - name: Copy mongo repo
    copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

  - name: test the inventory variable from group vars
    debug:
     msg: "{{ app_name }}" 

  - name: install mongodb
    package:
     state: present 
  - name: start mongodb
    service:
     name: mongodb
     state: started
     enabled: yes  
      
        